<style>

body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:#04070d;color:#d7f4ff;min-height:100vh;-webkit-tap-highlight-color:transparent}
body:before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.045) 1px,transparent 1px);background-size:28px 28px;pointer-events:none;z-index:0}
.wr{max-width:760px;margin:0 auto;padding:14px 14px 90px;position:relative;z-index:1}

.radar:after{content:"";position:absolute;left:50%;top:50%;width:50%;height:2px;background:linear-gradient(90deg,#00e5ff,transparent);transform-origin:left center;animation:spin 4.5s linear infinite}

.title{font-size:22px;font-weight:800;letter-spacing:3px;color:#00e5ff;text-shadow:0 0 14px rgba(0,229,255,.7)}
.sub{font-size:10.5px;letter-spacing:1.5px;color:#5f7f95;margin-top:2px}
.stamp{margin-left:auto;font-size:10px;color:#3d5a6e;text-align:right;line-height:1.5}
.weeksel{display:flex;gap:8px;margin:10px 0 4px}

.tabs{display:flex;gap:6px;margin:12px 0;position:sticky;top:0;z-index:5;background:#04070d;padding:8px 0}
.tabs button{flex:1;background:#08131d;border:1px solid #12344a;color:#7fb6d1;border-radius:9px;padding:11px 4px;font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer;white-space:nowrap;font-family:inherit}

.hidden{display:none!important}
.prog{font-size:11px;color:#ffb300;letter-spacing:1px;margin-bottom:8px}
.bar{height:6px;background:#0e2233;border-radius:99px;overflow:hidden;margin-top:6px}
.fill{height:100%;background:#ffb300;width:0%;transition:width .3s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}

.stat .v.amber{color:#ffb300}
.stat.wide{grid-column:1/-1}
.stat .hook{font-size:13px;color:#fff;margin-top:4px;line-height:1.4}
.sect{font-size:11px;letter-spacing:2px;color:#5f7f95;margin:16px 0 8px}
.abrow{background:#0a141f;border:1px solid #12344a;border-radius:10px;padding:9px 12px;margin-bottom:7px}

.abrow .top b{color:#fff}
.abrow .top .er{color:#00e5ff;font-weight:800}
.abrow .meta{font-size:11px;color:#5f7f95;margin-top:2px}
.abbar{height:5px;background:#0e2233;border-radius:99px;margin-top:7px;overflow:hidden}
.abfill{height:100%;background:#00e5ff}
.filters{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.filters select,.filters input{background:#08131d;border:1px solid #12344a;color:#d7f4ff;border-radius:9px;padding:10px;font-size:14px;font-family:inherit}
.filters select{flex:1;min-width:0}
.search{width:100%;background:#08131d;border:1px solid #12344a;color:#d7f4ff;border-radius:9px;padding:12px;font-size:16px;margin-bottom:10px;font-family:inherit}
.search::placeholder{color:#3d5a6e}
.count{font-size:11px;color:#5f7f95;margin-bottom:8px;letter-spacing:1px}
.pcard{background:#0a141f;border:1px solid #12344a;border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.pcard:active{background:#0d1a29}
.pcard .r1{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11px}
.badge{font-size:9.5px;font-weight:800;letter-spacing:.7px;border-radius:99px;padding:3px 8px}
.b-pain{background:rgba(255,80,80,.15);color:#ff8080;border:1px solid rgba(255,80,80,.4)}
.b-species{background:rgba(150,110,70,.18);color:#d8a86a;border:1px solid rgba(150,110,70,.45)}
.b-trust{background:rgba(0,229,255,.14);color:#00e5ff;border:1px solid rgba(0,229,255,.4)}
.b-engage{background:rgba(255,179,0,.13);color:#ffb300;border:1px solid rgba(255,179,0,.4)}
.b-tech{background:rgba(170,120,255,.14);color:#c09aff;border:1px solid rgba(170,120,255,.4)}
.b-fmt{background:#12344a;color:#7fb6d1}
.b-time{color:#5f7f95;font-weight:700;letter-spacing:.5px}
.pcard .hook{font-weight:700;font-size:14px;color:#fff;margin-top:6px;line-height:1.4}
.pcard .r3{display:flex;gap:8px;align-items:center;margin-top:8px}
.st{font-size:10px;font-weight:800;letter-spacing:.8px;border-radius:99px;padding:4px 10px}
.st-scheduled{background:rgba(255,255,255,.07);color:#8aa0b4;border:1px solid #234052}
.st-posted{background:rgba(0,229,255,.14);color:#00e5ff;border:1px solid rgba(0,229,255,.4)}
.st-skipped{background:rgba(255,80,80,.12);color:#ff8080;border:1px solid rgba(255,80,80,.35)}
.erchip{margin-left:auto;font-size:12px;font-weight:800;color:#ffb300}
.wrow{background:#0a141f;border:1px solid #12344a;border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.wrow.top3{border-color:#ffb300;box-shadow:0 0 10px rgba(255,179,0,.22)}
.rank{flex:0 0 30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;background:#12344a;color:#7fb6d1}
.wrow.top3 .rank{background:#ffb300;color:#1a1200}
.wmain{flex:1;min-width:0}
.wmain .hook{font-size:13px;font-weight:600;color:#fff;line-height:1.4}
.wmain .meta{font-size:11px;color:#5f7f95;margin-top:4px}
.wer{flex:0 0 auto;text-align:right}
.wer .n{font-size:18px;font-weight:800;color:#00e5ff}
.wer .l{font-size:9px;color:#5f7f95;letter-spacing:1px}
.empty{text-align:center;color:#5f7f95;padding:30px 10px;font-size:13px;line-height:1.6}
.btn{display:block;width:100%;background:#08131d;border:1px solid #00e5ff;color:#00e5ff;border-radius:10px;padding:14px;font-weight:800;font-size:14px;letter-spacing:1px;cursor:pointer;font-family:inherit;margin-top:10px}
.btn.amber{border-color:#ffb300;color:#ffb300}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheetcard{background:#0a141f;border:1px solid #12344a;border-bottom:none;border-radius:16px 16px 0 0;width:100%;max-width:760px;max-height:94vh;overflow-y:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheetcard h2{font-size:16px;color:#fff;line-height:1.4;margin:8px 0}
.sheetcard .fld{margin:10px 0}
.sheetcard label{display:block;font-size:10px;letter-spacing:1.2px;color:#5f7f95;margin-bottom:5px}
.sheetcard input,.sheetcard select,.sheetcard textarea{width:100%;background:#08131d;border:1px solid #12344a;color:#d7f4ff;border-radius:9px;padding:13px;font-size:16px;font-family:inherit}
.sheetcard textarea{min-height:64px;resize:vertical}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px}
.seg button{flex:1;background:#08131d;border:1px solid #12344a;color:#7fb6d1;border-radius:9px;padding:13px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
.seg button.on{border-color:#00e5ff;color:#00e5ff;background:#06283a}
.erlive{font-size:13px;color:#ffb300;font-weight:700;margin-top:6px}
.detail{background:#08131d;border-radius:9px;padding:10px 12px;font-size:13px;color:#9dc3d8;line-height:1.55;margin:8px 0;white-space:pre-wrap}
.detail b{color:#5f7f95;font-size:10px;letter-spacing:1.2px;display:block;margin-bottom:4px}
.rowbtns{display:flex;gap:8px;margin-top:12px}
.rowbtns .btn{margin-top:0}
.btn.danger{border-color:#ff8080;color:#ff8080}
.x{position:sticky;top:0;float:right;background:#08131d;border:1px solid #234052;color:#7fb6d1;border-radius:50%;width:36px;height:36px;font-size:16px;cursor:pointer}
@media(min-width:600px){.sheet{align-items:center}.sheetcard{border-radius:16px;border-bottom:1px solid #12344a}}
</style>
</head>
<body>
<div class="wr">
  <div class="hd">
    <div class="radar"></div>

  </div>

      <select id="fPillar"><option value="all">All pillars</option></select>

    </div>

    <div id="logList"></div>
    <button class="btn" id="btnCsv2">EXPORT POST LOG (CSV)</button>
  </div>

    <div id="winList"></div>
  </div>

  <div id="pane-analyze" class="hidden">
    <div class="sect">BY PILLAR</div><div id="anPillar"></div>
    <div class="sect">BY FORMAT</div><div id="anFormat"></div>

    <div class="sect">BY PLATFORM</div><div id="anPlatform"></div>
  </div>
</div>

<div id="sheet" class="sheet hidden">

    <div class="detail"><b>VISUAL</b><span id="mVisual"></span></div>

      <div class="fld"><label>LIKES</label><input id="fLikes" type="number" inputmode="numeric" min="0"></div>
      <div class="fld"><label>COMMENTS</label><input id="fComments" type="number" inputmode="numeric" min="0"></div>
      <div class="fld"><label>REPOSTS / SHARES</label><input id="fReposts" type="number" inputmode="numeric" min="0"></div>

      <div class="fld"><label>PROFILE VISITS</label><input id="fVisits" type="number" inputmode="numeric" min="0"></div>
      <div class="fld"><label>FOLLOWS</label><input id="fFollows" type="number" inputmode="numeric" min="0"></div>
      <div class="fld"><label>DMs / LEADS</label><input id="fDms" type="number" inputmode="numeric" min="0"></div>

    <div class="fld"><label>STATUS</label>
      <div class="seg" id="segStatus">

      </div></div>
    <div class="fld"><label>NOTES</label><textarea id="fNotes"></textarea></div>
    <div class="erlive" id="mERlive"></div>
    <div class="rowbtns">
      <button class="btn amber" id="btnSave">SAVE METRICS</button>
      <button class="btn danger" id="btnClear">CLEAR</button>
    </div>
  </div>
</div>

const PILLARS = {pain:'Pain Points',species:'Wood Species',trust:'Trust & Proof',engage:'Engagement',tech:'New Tech'};
const FORMATS = {thread:'Thread',image:'Image',reel:'Reel',carousel:'Carousel'};
const LS_KEY = 'pf-mktg-warroom-v1';

function defMetrics(){return {platform:'Threads',views:0,likes:0,comments:0,reposts:0,saves:0,visits:0,follows:0,dms:0,status:'scheduled',notes:''};}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt(n){return (+n||0).toLocaleString('en-US');}
function erOf(m){const v=+m.views||0;if(v<=0)return null;return ((+m.likes||0)+(+m.comments||0)+(+m.reposts||0)+(+m.saves||0))/v;}
function pct(r){return r==null?'\u2014':(r*100).toFixed(1)+'%';}
function getMet(store,weekId,pid){const w=store.metrics[weekId]||{};return Object.assign(defMetrics(),w[pid]||{});}

function groupAvg(posts,mets,keyFn){
  const map={};
  posts.forEach(function(p){
    const m=Object.assign(defMetrics(),mets[p.id]||{});
    const r=erOf(m); if(r==null)return;
    const k=keyFn(p,m);
    if(!map[k])map[k]={key:k,n:0,sum:0};
    map[k].n++;map[k].sum+=r;
  });
  return Object.values(map).map(function(x){return {key:x.key,n:x.n,avg:x.sum/x.n};}).sort(function(a,b){return b.avg-a.avg;});
}

function computeStats(posts,mets){
  let posted=0,skipped=0,views=0,erSum=0,erN=0,leads=0,follows=0,top=null;
  posts.forEach(function(p){
    const m=Object.assign(defMetrics(),mets[p.id]||{});
    if(m.status==='posted')posted++;
    if(m.status==='skipped')skipped++;
    leads+=+m.dms||0;follows+=+m.follows||0;
    const r=erOf(m);
    if(r!=null){views+=+m.views;erSum+=r;erN++;if(!top||r>top.r)top={p:p,r:r,m:m};}
  });
  const groups={
    pillar:groupAvg(posts,mets,function(p){return p.pillar;}),
    format:groupAvg(posts,mets,function(p){return p.format;}),
    slot:groupAvg(posts,mets,function(p){return p.time;}),
    platform:groupAvg(posts,mets,function(p,m){return m.platform;})
  };
  function best(g){let b=null;g.forEach(function(x){if(!b||x.avg>b.avg||(x.avg===b.avg&&x.n>b.n))b=x;});return b;}
  return {total:posts.length,posted:posted,skipped:skipped,views:views,
    avgER:erN?erSum/erN:null,erN:erN,top:top,leads:leads,follows:follows,
    bestPillar:best(groups.pillar),bestFormat:best(groups.format),
    bestSlot:best(groups.slot),bestPlatform:best(groups.platform),groups:groups};
}

function winners(posts,mets,n){
  const arr=[];
  posts.forEach(function(p){
    const m=Object.assign(defMetrics(),mets[p.id]||{});
    const r=erOf(m); if(r==null)return;
    arr.push({p:p,m:m,r:r});
  });
  arr.sort(function(a,b){return b.r-a.r;});
  return arr.slice(0,n||10);
}

function renderPostCard(p,m){
  const r=erOf(m);
  return '<div class="pcard" data-pid="'+esc(p.id)+'">'
    +'<div class="r1"><span class="badge b-'+esc(p.pillar)+'">'+esc(PILLARS[p.pillar]||p.pillar)+'</span>'
    +'<span class="badge b-fmt">'+esc(FORMATS[p.format]||p.format)+'</span>'
    +'<span class="b-time">'+esc(p.day.slice(0,3).toUpperCase())+' '+esc(p.time)+'</span></div>'
    +'<div class="hook">'+esc(p.hook)+'</div>'
    +'<div class="r3"><span class="st st-'+esc(m.status)+'">'+esc(m.status.toUpperCase())+'</span>'
    +(r!=null?'<span class="erchip">ER '+pct(r)+'</span>':'')
    +'</div></div>';
}

function boot(){
  let store;
  try{store=JSON.parse(localStorage.getItem(LS_KEY))||null;}catch(e){store=null;}
  if(!store||!store.metrics)store={metrics:{},ui:{week:null,tab:'command',fDay:'all',fPillar:'all',fStatus:'all',q:''}};
  store.ui=Object.assign({week:null,tab:'command',fDay:'all',fPillar:'all',fStatus:'all',q:''},store.ui||{});
  const weekIds=Object.keys(WEEKS).sort();
  if(!store.ui.week||!WEEKS[store.ui.week])store.ui.week=weekIds[0];
  function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(store));}catch(e){}}
  function posts(){return WEEKS[store.ui.week].posts;}
  function mets(){return store.metrics[store.ui.week]||{};}
  function setMet(pid,m){if(!store.metrics[store.ui.week])store.metrics[store.ui.week]={};store.metrics[store.ui.week][pid]=m;save();}

  const $=function(id){return document.getElementById(id);};
  const weekSel=$('weekSel');
  weekIds.forEach(function(id){const o=document.createElement('option');o.value=id;o.textContent=WEEKS[id].label;weekSel.appendChild(o);});
  weekSel.value=store.ui.week;
  weekSel.addEventListener('change',function(){store.ui.week=weekSel.value;save();renderAll();});

  document.querySelectorAll('.tabbtn').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.tabbtn').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on');store.ui.tab=b.dataset.tab;save();renderAll();
      window.scrollTo(0,0);
    });
    if(b.dataset.tab===store.ui.tab){document.querySelectorAll('.tabbtn').forEach(function(x){x.classList.remove('on');});b.classList.add('on');}
  });

  // log filters
  const fDay=$('fDay'),fPillar=$('fPillar'),fStatus=$('fStatus'),fSearch=$('fSearch');
  const days=[];posts().forEach(function(p){if(days.indexOf(p.day)<0)days.push(p.day);});
  days.forEach(function(d){const o=document.createElement('option');o.value=d;o.textContent=d;fDay.appendChild(o);});
  Object.keys(PILLARS).forEach(function(k){const o=document.createElement('option');o.value=k;o.textContent=PILLARS[k];fPillar.appendChild(o);});
  fDay.value=store.ui.fDay;fPillar.value=store.ui.fPillar;fStatus.value=store.ui.fStatus;fSearch.value=store.ui.q;
  [fDay,fPillar,fStatus].forEach(function(el){el.addEventListener('change',function(){store.ui.fDay=fDay.value;store.ui.fPillar=fPillar.value;store.ui.fStatus=fStatus.value;save();renderLog();});});
  let qT;fSearch.addEventListener('input',function(){clearTimeout(qT);qT=setTimeout(function(){store.ui.q=fSearch.value;save();renderLog();},200);});

  function filtered(){
    const q=(store.ui.q||'').toLowerCase();
    return posts().filter(function(p){
      const m=getMet(store,store.ui.week,p.id);
      if(store.ui.fDay!=='all'&&p.day!==store.ui.fDay)return false;
      if(store.ui.fPillar!=='all'&&p.pillar!==store.ui.fPillar)return false;
      if(store.ui.fStatus!=='all'&&m.status!==store.ui.fStatus)return false;
      if(q&&(p.hook+' '+p.caption+' '+(p.hashtags||'')).toLowerCase().indexOf(q)<0)return false;
      return true;
    });
  }

  function statCard(k,v,cls,wide,extra){
    return '<div class="stat'+(wide?' wide':'')+'"><div class="k">'+k+'</div><div class="v'+(cls?' '+cls:'')+'">'+v+'</div>'+(extra||'')+'</div>';
  }

  function renderCommand(){
    const s=computeStats(posts(),mets());
    $('cProg').innerHTML='POSTED '+s.posted+'/'+s.total+' · SKIPPED '+s.skipped+'<div class="bar"><div class="fill" style="width:'+(s.total?Math.round(s.posted/s.total*100):0)+'%"></div></div>';
    let h='';
    h+=statCard('TOTAL VIEWS',fmt(s.views));
    h+=statCard('AVG ENG RATE',pct(s.avgER),'amber');
    h+=statCard('DMS / LEADS',fmt(s.leads));
    h+=statCard('FOLLOWS',fmt(s.follows));
    h+=statCard('TOP POST',s.top?esc(s.top.p.hook.slice(0,60))+(s.top.p.hook.length>60?'…':''):'—',null,true,
      s.top?'<div class="hook" style="color:#ffb300">ER '+pct(s.top.r)+' · '+fmt(s.top.m.views)+' views · '+esc(s.top.m.platform)+'</div>':'<div class="hook">Log metrics to crown a winner</div>');
    function bk(label,b,fmtFn){return statCard(label,b?fmtFn(b):'\u2014',b?'amber':'',false,b?'<div class="hook">'+b.n+' post'+(b.n>1?'s':'')+' tracked</div>':'<div class="hook">No data yet</div>');}
    h+=bk('BEST PILLAR',s.bestPillar,function(b){return esc(PILLARS[b.key]||b.key);});
    h+=bk('BEST FORMAT',s.bestFormat,function(b){return esc(FORMATS[b.key]||b.key);});
    h+=bk('BEST TIME SLOT',s.bestSlot,function(b){return esc(b.key)+' ET';});
    h+=bk('BEST PLATFORM',s.bestPlatform,function(b){return esc(b.key);});
    $('cGrid').innerHTML=h;
    $('stamp').innerHTML=WEEKS[store.ui.week].label.toUpperCase()+'<br>'+s.posted+'/'+s.total+' POSTED';
  }

  function renderLog(){
    const list=filtered();
    $('logCount').textContent=list.length+' / '+posts().length+' POSTS';
    $('logList').innerHTML=list.map(function(p){return renderPostCard(p,getMet(store,store.ui.week,p.id));}).join('')
      ||'<div class="empty">No posts match the filters.</div>';
    document.querySelectorAll('#logList .pcard').forEach(function(c){
      c.addEventListener('click',function(){openSheet(c.dataset.pid);});
    });
  }

  function renderWinners(){
    const w=winners(posts(),mets(),10);
    if(!w.length){$('winList').innerHTML='<div class="empty">No metrics logged yet.<br>Tap a post in POST LOG to enter views.</div>';return;}
    $('winList').innerHTML=w.map(function(x,i){
      const m=x.m;
      return '<div class="wrow'+(i<3?' top3':'')+'"><div class="rank">'+(i+1)+'</div>'
        +'<div class="wmain"><div class="hook">'+esc(x.p.hook)+'</div>'
        +'<div class="meta">'+esc(x.p.day.slice(0,3))+' '+esc(x.p.time)+' · '+esc(PILLARS[x.p.pillar]||x.p.pillar)+' · '+esc(FORMATS[x.p.format]||x.p.format)+' · '+esc(m.platform)
        +' · '+fmt(m.views)+' views · '+fmt(m.likes)+' likes · '+fmt(m.comments)+' cmt · '+fmt(m.reposts)+' rp · '+fmt(m.saves)+' saves</div></div>'
        +'<div class="wer"><div class="n">'+pct(x.r)+'</div><div class="l">ENG</div></div></div>';
    }).join('');
  }

  function abSection(el,groups,labelFn){
    if(!groups.length){el.innerHTML='<div class="empty">No data yet.</div>';return;}
    const mx=Math.max.apply(null,groups.map(function(g){return g.avg;}));
    el.innerHTML=groups.map(function(g){
      return '<div class="abrow"><div class="top"><b>'+esc(labelFn(g.key))+'</b><span class="er">'+pct(g.avg)+'</span></div>'
        +'<div class="meta">'+g.n+' post'+(g.n>1?'s':'')+' with metrics</div>'
        +'<div class="abbar"><div class="abfill" style="width:'+Math.round(g.avg/mx*100)+'%"></div></div></div>';
    }).join('');
  }

  function renderAnalyze(){
    const s=computeStats(posts(),mets());
    abSection($('anPillar'),s.groups.pillar,function(k){return PILLARS[k]||k;});
    abSection($('anFormat'),s.groups.format,function(k){return FORMATS[k]||k;});
    abSection($('anSlot'),s.groups.slot,function(k){return k+' ET';});
    abSection($('anPlatform'),s.groups.platform,function(k){return k;});
  }

  function renderAll(){
    ['command','log','winners','analyze'].forEach(function(t){$('pane-'+t).classList.toggle('hidden',store.ui.tab!==t);});
    renderCommand();renderLog();renderWinners();renderAnalyze();
  }

  /* ---- metrics sheet ---- */
  let curPid=null,curStatus='scheduled';
  function openSheet(pid){
    curPid=pid;
    const p=posts().filter(function(x){return x.id===pid;})[0];
    const m=getMet(store,store.ui.week,pid);
    curStatus=m.status;
    $('mMeta').innerHTML='<span class="badge b-'+esc(p.pillar)+'">'+esc(PILLARS[p.pillar]||p.pillar)+'</span> '
      +'<span class="badge b-fmt">'+esc(FORMATS[p.format]||p.format)+'</span> '
      +'<span class="b-time">'+esc(p.day.toUpperCase())+' '+esc(p.time)+' ET</span>';
    $('mHook').textContent=p.hook;
    $('mCaption').textContent=p.caption||'';
    $('mVisual').textContent=p.visual||'';
    $('mCta').textContent=((p.cta||'')+'\n'+(p.hashtags||'')).trim();
    $('fPlatform').value=m.platform;
    $('fViews').value=m.views||'';$('fLikes').value=m.likes||'';$('fComments').value=m.comments||'';
    $('fReposts').value=m.reposts||'';$('fSaves').value=m.saves||'';$('fVisits').value=m.visits||'';
    $('fFollows').value=m.follows||'';$('fDms').value=m.dms||'';$('fNotes').value=m.notes||'';
    document.querySelectorAll('#segStatus button').forEach(function(b){b.classList.toggle('on',b.dataset.s===curStatus);});
    updER();$('sheet').classList.remove('hidden');
  }
  function num(id){const v=parseInt($('f'+id).value,10);return isNaN(v)||v<0?0:v;}
  function updER(){
    const m={views:num('Views'),likes:num('Likes'),comments:num('Comments'),reposts:num('Reposts'),saves:num('Saves')};
    const r=erOf(m);
    $('mERlive').textContent=r==null?'ENGAGEMENT RATE: — (enter views)':'ENGAGEMENT RATE: '+pct(r);
  }
  ['Views','Likes','Comments','Reposts','Saves'].forEach(function(k){$('f'+k).addEventListener('input',updER);});
  document.querySelectorAll('#segStatus button').forEach(function(b){
    b.addEventListener('click',function(){curStatus=b.dataset.s;
      document.querySelectorAll('#segStatus button').forEach(function(x){x.classList.toggle('on',x===b);});});
  });
  $('btnClose').addEventListener('click',function(){$('sheet').classList.add('hidden');});
  $('sheet').addEventListener('click',function(e){if(e.target===$('sheet'))$('sheet').classList.add('hidden');});
  $('btnSave').addEventListener('click',function(){
    setMet(curPid,{platform:$('fPlatform').value,views:num('Views'),likes:num('Likes'),comments:num('Comments'),
      reposts:num('Reposts'),saves:num('Saves'),visits:num('Visits'),follows:num('Follows'),dms:num('Dms'),
      status:curStatus,notes:$('fNotes').value});
    $('sheet').classList.add('hidden');renderAll();
  });
  $('btnClear').addEventListener('click',function(){
    const w=store.metrics[store.ui.week];if(w)delete w[curPid];save();
    $('sheet').classList.add('hidden');renderAll();
  });

  function csv(){
    const rows=[['week','date','day','time','pillar','format','platform','status','views','likes','comments','reposts','saves','profile_visits','follows','dms_leads','engagement_rate','hook','notes']];
    posts().forEach(function(p){
      const m=getMet(store,store.ui.week,p.id);const r=erOf(m);
      rows.push([store.ui.week,p.date,p.day,p.time,PILLARS[p.pillar]||p.pillar,FORMATS[p.format]||p.format,
        m.platform,m.status,m.views,m.likes,m.comments,m.reposts,m.saves,m.visits,m.follows,m.dms,
        r==null?'':(r*100).toFixed(2)+'%','"'+String(p.hook).replace(/"/g,'""')+'"','"'+String(m.notes||'').replace(/"/g,'""')+'"']);
    });
    const blob=new Blob([rows.map(function(r){return r.join(',');}).join('\n')],{type:'text/csv'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='pf-mktg-postlog-'+store.ui.week+'.csv';a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
  }
  $('btnCsv1').addEventListener('click',csv);
  $('btnCsv2').addEventListener('click',csv);

  renderAll();
}

if(typeof document!=='undefined'&&typeof document.getElementById==='function'){boot();}
</script>
</body>
</html>
